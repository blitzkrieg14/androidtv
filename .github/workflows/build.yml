name: Build & Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run lint
        run: |
          ./gradlew assembleDebug lint
          cp app/build/outputs/apk/debug/app-debug.apk GlassOS-Tracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: glassos-tracker-apk
          path: GlassOS-Tracker.apk
      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GlassOS-Tracker.apk
          generate_release_notes: true
